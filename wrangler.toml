name = "gun"
main = "src/worker.js"
compatibility_date = "2026-05-14"

assets = { directory = "./public", binding = "ASSETS" }

[[durable_objects.bindings]]
name = "GUN_PEER"
class_name = "GunPeerObject"

# Declarative exports replace the old v1 migration (new_sqlite_classes). Cloudflare now
# requires every provisioned DO class here; keep in sync with cloudflare.config.ts.
[exports.GunPeerObject]
type = "durable-object"
storage = "sqlite"

[vars]
# Free plan: 5 GB total. Evict from 4 GiB, freeing 512 MiB per pass.
STORAGE_LIMIT_BYTES = "5000000000"
STORAGE_EVICT_AT_BYTES = "4294967296"
STORAGE_EVICT_BYTES = "536870912"

# ponytail: sampled so request patterns show up in `cf observability telemetry query`
# without spending the free plan's daily log event allowance on every WebSocket message.
[observability]
enabled = true
head_sampling_rate = 0.1
